function draw(){let cam=Math.max(0,Math.min(W-960,p.x-240));g.clearRect(0,0,960,480);g.save();if(screenShake)g.translate(Math.sin(tick*3)*3,0);let sky=g.createLinearGradient(0,0,0,470);sky.addColorStop(0,'#514e9a');sky.addColorStop(.52,'#e9a5a6');sky.addColorStop(1,'#f9d9a0');g.fillStyle=sky;g.fillRect(0,0,960,480);

  g.save();g.globalAlpha=.87;
  let drift=(cam*.075)%1040;
  g.drawImage(scenic,-drift,0,1040,480);g.drawImage(scenic,1040-drift,0,1040,480);
  g.restore();
 }
 drawClouds(cam);drawSunbeams(cam);
// Mountains and distant castle move slower than foreground.
// Distant castle and mountains are already painted into the high-detail backdrop.
for(let i=0;i<3;i++){let x=i*1000+90-cam*.35;let im=treeArt[i%3?'oak':'willow'];if(im.complete&&im.naturalWidth)g.drawImage(im,Math.round(x-130),90,260,302);else tree(x,380,1.2,false)}drawWaterfall(cam);drawRuins(cam);

for(let i=0;i<35;i++){let x=((i*127+Math.sin(tick*.012+i)*22-cam*.5)%1100+1100)%1100-40,y=90+(i*83)%285;ellipse(x,y,1.2+Math.sin(tick*.05+i)*.5,1.2,'#fff3b7aa')}
for(let i=0;i<3;i++){let x=i*1050+110-cam*.72;let im=treeArt[i%2?'oak':'willow'];if(im.complete&&im.naturalWidth)g.drawImage(im,Math.round(x-135),90,270,320)}drawVines(cam);
// Ground and stonework.
drawGround(cam);drawBridge(cam);

drawDecorations(cam);for(let d of gems)if(!d.taken){let y=d.y+Math.sin(tick*.06+d.x)*4;g.fillStyle='#9d6aff';g.beginPath();g.moveTo(d.x-cam,y-14);g.lineTo(d.x+10-cam,y-4);g.lineTo(d.x+8-cam,y+7);g.lineTo(d.x-cam,y+16);g.lineTo(d.x-9-cam,y+4);g.lineTo(d.x-10-cam,y-5);g.fill();rect(d.x-3-cam,y-9,5,13,'#f8ddff')}
for(let o of obstacles)if(o.hp>0){let x=o.x-cam;rect(x,o.y,o.w,o.h,'#695d72');rect(x+3,o.y+3,o.w-6,7,'#a596a1');for(let j=0;j<o.hp;j++)rect(x+4+j*10,o.y+14,7,4,'#c4b5a2');rect(x+5,o.y+o.h-10,o.w-10,4,'#3d455b')}
for(let e of enemies)if(e.alive){let b=enemyBox(e),x=b.x-cam,y=b.y;
 let img=enemyArt[e.type];if(img.complete&&img.naturalWidth){g.drawImage(img,(Math.floor(tick/(e.type==='bat'?7:13))%4)*96,0,96,96,Math.round(x-7),Math.round(y-19),Math.round(b.w+14),Math.round(b.h+25));}
 else {ellipse(x+b.w/2,y+b.h/2,b.w/2,b.h/2,e.type==='beetle'?'#987a78':e.type==='bat'?'#654275':'#42c5e0')}
}
for(let [x,symbol,enabled] of [[550,'✦',!fire],[985,'?',!bridge],[2350,'⚑',!dragon.dead]])if(enabled){rect(x-21-cam,ground-105,42,66,'#30284f');rect(x-18-cam,ground-101,36,59,'#61518a');rect(x-14-cam,ground-97,28,51,'#322a59');g.font='bold 29px system-ui';g.textAlign='center';g.fillStyle='#ffe7a0';g.fillText(symbol,x-cam,ground-60);g.textAlign='left'}
// Flowers and mushrooms in foreground.
for(let i=0;i<135;i++){let x=i*21-cam,y=ground-8;g.strokeStyle=i%3?'#4cba66':'#8dd45f';g.lineWidth=1.5;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.sin(tick*.045+i)*4,y-9,x+Math.sin(tick*.045+i)*6,y-15-(i%5)*2);g.stroke();if(i%7===0){ellipse(x-3,y-15,3,3,'#f4a5d4');ellipse(x+3,y-15,3,3,'#f6e5a1')}}

 else{ellipse(dx,dy+58,50,36,'#682d91')}
 if(p.x>1750){rect(660,64,270,18,'#241633');rect(664,68,262*(dragon.hp/dragon.max),10,'#ff527f');g.fillStyle='#ffe6bd';g.font='bold 14px system-ui';g.fillText('DRACHE · Treffer + Mathematik',670,60)}
 }

 if(!invuln||tick%6<3)sprite(p.x-cam,p.y,hero,tick);
for(let s of shots){ellipse(s.x-cam,s.y,15,8,'#f77c22');ellipse(s.x-cam,s.y,9,7,'#ffe57c');ellipse(s.x-cam,s.y,4,4,'#fffde6')}

rect(12,12,225,43,'#16172dc9');rect(14,14,221,3,'#e9bc69');g.fillStyle='#f7e7cb';g.font='bold 18px system-ui';g.fillText(hero?'Emmy':'Helga',26,40);g.font='16px system-ui';g.fillText('♥ ♥ ♥',106,40);rect(244,12,177,43,'#16172dc9');g.fillStyle='#dfc6ff';g.font='bold 18px system-ui';g.fillText('◆ '+diamonds,260,40);g.fillStyle='#f9e3a7';g.font='bold 18px system-ui';g.fillText('Wald der Anfangswerte',455,36);g.restore();requestAnimationFrame(frame)}
function frame(){update();draw()}document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyE'){hero=1-hero;hud()}if(e.code==='KeyF')shoot();if(e.code==='KeyR')reset()});document.addEventListener('keyup',e=>keys[e.code]=false);function shoot(){if(fire&&!paused&&performance.now()-lastShot>280){shots.push({x:p.x+(facing>0?30:-4),y:p.y+22,dir:facing});burst(p.x+14+facing*18,p.y+22,"#ffb03d",7);lastShot=performance.now()}}document.getElementById('switch').onclick=()=>{hero=1-hero;hud()};document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.classList.add('pressed');if(k==='KeyF')shoot()});for(let ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>{keys[k]=false;b.classList.remove('pressed')})});reset();frame();
