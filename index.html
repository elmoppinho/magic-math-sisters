<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2a6b">
<title>Magic Math Sisters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#2a3a8c;--page2:#141d4f;--ink:#ffffff;--soft:#b9c3f2;--panel:#141b45;--edge:#ffffff;
  --gold:#ffd23a;--ok:#2fbf55;--bad:#e2463c;--btn:#3b54c8;--btnhi:#5470e8;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--page:#5c94fc;--page2:#2c56c4;color-scheme:light}}
:root[data-theme="light"]{--page:#5c94fc;--page2:#2c56c4;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:"Nunito",system-ui,sans-serif;
  background:radial-gradient(120% 90% at 50% 0%,var(--page),var(--page2));
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;align-items:center;justify-content:center}
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border:4px solid #0b0f2a;border-radius:6px;box-shadow:0 0 0 3px #ffffff30,0 14px 40px #0008}
#keys{font-size:15px;color:var(--soft);margin:12px 0 0;text-align:center;line-height:1.5;padding:0 12px;max-width:820px}
#keys b{color:var(--ink);font-weight:800}
#toggles{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(10px,env(safe-area-inset-right,0px));z-index:6;display:flex;gap:8px}
.tog{font-family:"Press Start 2P",monospace;font-size:9px;line-height:1;background:#0b0f2acc;color:#fff;border:2px solid #fff;border-radius:10px;padding:8px 10px;cursor:pointer}
.tog[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.tog:focus-visible,.round:focus-visible,.pill:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.touch{display:none}
@media (pointer:coarse){.touch{display:block}#keys{display:none}}
#pad{position:fixed;width:140px;height:140px;touch-action:none;z-index:4}
#pad .arm{position:absolute;background:#0b0f2ad9;border:2px solid #ffffff90}
#pad .h{left:0;right:0;top:47px;height:46px;border-radius:10px}
#pad .v{top:0;bottom:0;left:47px;width:46px;border-radius:10px}
#pad .tri{position:absolute;width:0;height:0;border:8px solid transparent;opacity:.6}
#pad .tl{left:8px;top:62px;border-right-color:#fff}#pad .tr{right:8px;top:62px;border-left-color:#fff}
#pad .tu{top:8px;left:62px;border-bottom-color:#fff}#pad .td{bottom:8px;left:62px;border-top-color:#fff}
#pad.l .tl,#pad.r .tr,#pad.u .tu,#pad.d .td{opacity:1;filter:drop-shadow(0 0 4px var(--gold))}
#ab{position:fixed;width:176px;height:124px;touch-action:none;z-index:4}
.round{position:absolute;width:72px;height:72px;border-radius:50%;border:3px solid #fff;color:#fff;font-family:"Press Start 2P",monospace;font-size:15px;box-shadow:0 5px 0 #0008;touch-action:none}
#bA{right:0;top:0;background:#e2463c}#bB{left:0;top:46px;background:#f0b020;color:#3a2400}
.round.down,.pill.down{transform:translateY(3px);box-shadow:0 1px 0 #0008;filter:brightness(1.2)}
#meta{position:fixed;gap:10px;touch-action:none;z-index:4}
@media (pointer:coarse){#meta{display:flex}}
.pill{font-family:"Press Start 2P",monospace;font-size:8px;color:#fff;background:#0b0f2acc;border:2px solid #fff;border-radius:14px;padding:9px 12px;touch-action:none}

/* Fragefenster */
#quiz{display:none;position:fixed;z-index:10;inset:0;align-items:center;justify-content:center;background:#050a20b8;padding:max(8px,env(safe-area-inset-top,0px)) 10px max(8px,env(safe-area-inset-bottom,0px));touch-action:pan-y}
#quiz.open{display:flex}
#qbox{width:min(780px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--panel);color:#fff;
  border:4px solid #fff;border-radius:16px;box-shadow:0 0 0 4px #0b0f2a,0 18px 60px #000a;padding:16px 20px 16px}
#qt{font-family:"Press Start 2P",monospace;font-size:clamp(9px,1.7vw,12px);line-height:1.6;margin:0 0 4px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--gold)}
#qt span:last-child{color:var(--soft)}
#question{font-size:clamp(17px,2.7vh,22px);font-weight:800;line-height:1.4;margin:8px 0 14px}
#answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#answers button{font-family:inherit;font-weight:600;font-size:clamp(15px,2.4vh,19px);text-align:left;line-height:1.3;min-height:56px;padding:8px 12px;
  background:var(--btn);color:#fff;border:3px solid #fff;border-radius:12px;box-shadow:0 4px 0 #0b0f2a;cursor:pointer;overflow-x:auto;touch-action:manipulation}
#answers button:hover:not(:disabled){background:var(--btnhi)}
#answers button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#answers button.right{background:var(--ok)}
#answers button.wrong{background:var(--bad)}
#answers button:disabled{cursor:default}
#answers button:disabled:not(.right):not(.wrong){opacity:.5}
#answers b{font-family:"Press Start 2P",monospace;font-size:10px;font-weight:400;margin-right:8px;color:var(--gold)}
#answers button.right b,#answers button.wrong b{color:#fff}
#result{display:none;margin:14px 0 0;padding:10px 14px;border-radius:12px;border:3px solid #fff;font-size:clamp(15px,2.4vh,19px);line-height:1.4}
#result.ok{display:block;background:#1d7a3a}#result.bad{display:block;background:#8e2a24}
#result strong{font-family:"Press Start 2P",monospace;font-size:11px;display:block;margin-bottom:6px;font-weight:400}
#next{display:none;margin:12px 0 0 auto;font-family:"Press Start 2P",monospace;font-size:11px;color:#3a2400;background:var(--gold);border:3px solid #fff;border-radius:12px;padding:12px 16px;box-shadow:0 4px 0 #0b0f2a;cursor:pointer}
#next.show{display:block}
#quiz mjx-container{max-width:100%}
@media (max-width:560px){#answers{grid-template-columns:1fr}}
@media (max-height:440px){#qbox{padding:10px 14px}#question{margin:4px 0 8px}#answers{gap:6px}#answers button{min-height:40px;padding:5px 10px}#result{margin-top:8px;padding:6px 10px}#next{margin-top:8px;padding:9px 12px}}
</style>
</head>
<body>
<main id="app">
  <canvas id="screen" width="320" height="288" aria-label="Spielbildschirm"></canvas>
  <p id="keys"><b>← →</b> laufen · <b>Leertaste / ↑</b> springen · <b>Shift / X</b> rennen &amp; Feuer · <b>↓</b> ins Rohr · <b>E</b> Schwester · <b>Enter</b> Start/Pause · <b>M</b> Musik · <b>N</b> Effekte</p>
</main>
<div id="toggles">
  <button class="tog" id="musBtn" aria-pressed="true">♪ MUSIK</button>
  <button class="tog" id="sfxBtn" aria-pressed="true">◀) EFFEKTE</button>
</div>
<div class="touch" id="pad" aria-label="Steuerkreuz"><div class="arm h"></div><div class="arm v"></div>
  <div class="tri tl"></div><div class="tri tr"></div><div class="tri tu"></div><div class="tri td"></div></div>
<div class="touch" id="ab"><button class="round" id="bB" data-k="b" aria-label="B: rennen und Feuer">B</button><button class="round" id="bA" data-k="a" aria-label="A: springen">A</button></div>
<div class="touch" id="meta"><button class="pill" data-k="select">SCHWESTER</button><button class="pill" data-k="start">START</button></div>

<div id="quiz" role="dialog" aria-modal="true" aria-labelledby="qt"><div id="qbox">
  <h2 id="qt"><span id="qtitle"></span><span id="qtype"></span></h2>
  <div id="question"></div>
  <div id="answers"></div>
  <div id="result" aria-live="polite"></div>
  <button id="next">WEITER ▶</button>
</div></div>

<!-- Fragen: in questions.js bearbeiten -->
<script src="questions.js"></script>
<script>window.MathJax={tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"]]},svg:{fontCache:"global"},startup:{typeset:false}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<script>
'use strict';
/* =====================================================================
   MAGIC MATH SISTERS – 16-Bit-Edition
   Logische Welt 160×144 (8er-Kacheln), Darstellung 320×288 mit
   detaillierter Pixelgrafik. Die Fragen stehen in questions.js.
   ===================================================================== */
const VW=160,VH=144,GROUND=112,DW=320,DH=288,HUD=32;
const cv=document.getElementById('screen'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
const fl=Math.floor,OL='#1a1226';

/* ---------------- Fragen ---------------- */
const DEFAULT_Q=[{type:'Rechnen',q:'Löse \\(y^{\\prime}=-y,\\ y(0)=1\\).',a:['\\(e^{t}\\)','\\(e^{-t}\\)','\\(1-t\\)','\\(t\\)'],ok:1,why:'\\(y=Ce^{-t}\\) und \\(C=1\\).'}];
let QUESTIONS=(Array.isArray(window.MMS_QUESTIONS)&&window.MMS_QUESTIONS.length?window.MMS_QUESTIONS:DEFAULT_Q).filter(q=>q&&Array.isArray(q.a)&&q.a.length>=2);
const SETTINGS=Object.assign({shuffle:false},window.MMS_SETTINGS||{});

/* ---------------- Zeichen-Werkzeuge ---------------- */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function mirror(c){const m=mkCanvas(c.width,c.height),x=m.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return m}
function vflip(c){const m=mkCanvas(c.width,c.height),x=m.getContext('2d');x.translate(0,c.height);x.scale(1,-1);x.drawImage(c,0,0);return m}
function R(x,X,Y,W,H,col){x.fillStyle=col;x.fillRect(Math.round(X),Math.round(Y),Math.round(W),Math.round(H))}
function E(x,cx,cy,rx,ry,col){x.fillStyle=col;for(let dy=-ry;dy<=ry;dy++){const dx=Math.round(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry+.6))));x.fillRect(Math.round(cx-dx),Math.round(cy+dy),dx*2+1,1)}}
function PG(x,pts,col){x.fillStyle=col;let y0=Infinity,y1=-Infinity;for(const p of pts){y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}
  for(let y=fl(y0);y<=Math.ceil(y1);y++){const sy=y+.5,xs=[];
    for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];if((a[1]<=sy&&b[1]>sy)||(b[1]<=sy&&a[1]>sy))xs.push(a[0]+(sy-a[1])/(b[1]-a[1])*(b[0]-a[0]))}
    xs.sort((p,q)=>p-q);for(let i=0;i+1<xs.length;i+=2){const xa=Math.round(xs[i]),xb=Math.round(xs[i+1]);if(xb>xa)x.fillRect(xa,y,xb-xa,1)}}}
function bits(x,rows,X,Y,col,sc=1){x.fillStyle=col;rows.forEach((r,j)=>{for(let i=0;i<r.length;i++)if(r[i]!=='.')x.fillRect(X+i*sc,Y+j*sc,sc,sc)})}
function outline(c,col=OL){const x=c.getContext('2d'),w=c.width,h=c.height,d=x.getImageData(0,0,w,h),a=d.data,mark=[];
  const op=(i,j)=>{if(i<0||j<0||i>=w||j>=h)return false;const k=(j*w+i)*4;return a[k+3]>0&&!(a[k]===26&&a[k+1]===18&&a[k+2]===38)};
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(a[(j*w+i)*4+3])continue;if(op(i-1,j)||op(i+1,j)||op(i,j-1)||op(i,j+1))mark.push(i,j)}
  x.fillStyle=col;for(let k=0;k<mark.length;k+=2)x.fillRect(mark[k],mark[k+1],1,1);return c}
function sprite(w,h,fn,ol=true){const c=mkCanvas(w,h),x=c.getContext('2d');fn(x);if(ol)outline(c);return{r:c,l:mirror(c),w:w/2,h:h/2}}
function tileImg(fn,w=16,h=16){const c=mkCanvas(w,h);fn(c.getContext('2d'));return c}
function tint(c,col,alpha=.6){const m=mkCanvas(c.width,c.height),x=m.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-atop';x.globalAlpha=alpha;x.fillStyle=col;x.fillRect(0,0,m.width,m.height);return m}

/* ---------------- Schrift 5×7 mit Kontur ---------------- */
const FONTSRC={A:'0e1111111f1111',B:'1e11111e11111e',C:'0e11101010110e',D:'1c12111111121c',E:'1f10101e10101f',F:'1f10101e101010',G:'0e11101711110f',H:'1111111f111111',I:'0e04040404040e',J:'0702020202120c',K:'11121418141211',L:'1010101010101f',M:'111b1515111111',N:'11111915131111',O:'0e11111111110e',P:'1e11111e101010',Q:'0e11111115120d',R:'1e11111e141211',S:'0f10100e01011e',T:'1f040404040404',U:'1111111111110e',V:'11111111110a04',W:'1111111515150a',X:'11110a040a1111',Y:'1111110a040404',Z:'1f01020408101f',
'0':'0e11131519110e','1':'040c040404040e','2':'0e11010204081f','3':'1f02040201110e','4':'02060a121f0202','5':'1f101e0101110e','6':'0608101e11110e','7':'1f010204080808','8':'0e11110e11110e','9':'0e11110f01020c',
'Ä':'0a000e111f1111','Ö':'0a000e1111110e','Ü':'0a00111111110e','-':'0000000e000000',':':'000c0c000c0c00','.':'00000000000c0c','!':'04040404040004','?':'0e110102040004','×':'00110a040a1100','◆':'040e1f1f0e0400','♥':'000a1f1f0e0400','/':'01010204081010',',':'000000000c0408','+':'0004041f040400',"'":'0c040800000000','▶':'080c0e0f0e0c08','Σ':'1f100804081f00','(':'02040808080402',')':'08040202020408','↓':'040404150e0400','=':'00001f001f0000','★':'04040e1f0e1b11','✓':'00010102140800'};
const FONT={};for(const k in FONTSRC){const s=FONTSRC[k];FONT[k]=[0,1,2,3,4,5,6].map(i=>parseInt(s.substr(i*2,2),16))}
const GCACHE=new Map();
function glyph(ch,col,sc){const key=ch+col+sc;let c=GCACHE.get(key);if(c)return c;const gl=FONT[ch];if(!gl)return null;
  c=mkCanvas(5*sc+2,7*sc+2);const x=c.getContext('2d');for(let pass=0;pass<2;pass++){x.fillStyle=pass?col:OL;
    for(let j=0;j<7;j++)for(let i=0;i<5;i++)if(gl[j]&(16>>i)){if(pass)x.fillRect(1+i*sc,1+j*sc,sc,sc);else x.fillRect(i*sc,j*sc,sc+2,sc+2)}}
  GCACHE.set(key,c);return c}
function norm(s){return String(s).toUpperCase().replace(/ß/g,'SS')}
function text(s,x,y,col='#fff',sc=1){let cx=Math.round(x);for(const ch of norm(s)){const c=glyph(ch,col,sc);if(c)g.drawImage(c,cx-1,Math.round(y)-1);cx+=6*sc}}
function tw(s,sc=1){return[...norm(s)].length*6*sc-sc}
function textC(s,y,col,sc=1,cx=DW/2){text(s,Math.round(cx-tw(s,sc)/2),y,col,sc)}
function textR(s,xr,y,col,sc=1){text(s,xr-tw(s,sc),y,col,sc)}

/* ---------------- Heldinnen ---------------- */
const SKIN='#f8c8a0';
const HC=[{hair:'#8b4524',hairL:'#c47a3e',cape:'#d8343c',capeD:'#9a2232',tun:'#b0ad8c',tunD:'#7d7a60',boot:'#6a3a1c',leg:'#eadfcb',rib:null,curl:false},
          {hair:'#f2c640',hairL:'#fff0a0',cape:'#2aa868',capeD:'#1a7046',tun:'#82c45e',tunD:'#528c3c',boot:'#6a3a1c',leg:'#eadfcb',rib:'#ff7ab0',curl:true}];
function heroImg(hi,big,pose,fire){const C={...HC[hi]};if(fire){C.cape='#ffffff';C.capeD='#c4d0ec';C.tun='#ff8a30';C.tunD='#c85a1a'}
  const H=big?44:28;return sprite(24,H,x=>{
    const by=big?15:13,ly=big?32:21,fy=H-1,bootY=fy-4;
    const cp={stand:[[8,by+1],[13,by+1],[12,ly+4],[4,ly+4],[3,ly]],a:[[8,by+1],[13,by+1],[10,ly+1],[1,ly-3],[2,ly-7]],
      b:[[8,by+1],[13,by+1],[11,ly+3],[3,ly+1],[2,ly-3]],jump:[[8,by+1],[13,by+1],[9,ly-2],[0,by+5],[3,by+1]]}[pose];
    PG(x,cp,C.cape);PG(x,cp.map(([a,b])=>[a+2,b]).slice(0,3).concat([[8,ly]]),C.capeD);
    const legs={stand:[[9,0],[14,0]],a:[[6,0],[16,0]],b:[[11,0],[12,0]],jump:[[8,0],[15,-4]]}[pose];
    legs.forEach(([lx,lift],k)=>{R(x,lx,ly,4,bootY-ly+1+lift,k?C.leg:'#cfc2ac');R(x,lx-1,bootY+lift,6,4,C.boot);R(x,lx-1,bootY+lift,6,1,'#9a5a30')});
    PG(x,[[8,by],[17,by],[19,ly+1],[6,ly+1]],C.tun);R(x,16,by+2,2,ly-by-1,C.tunD);
    const belt=big?by+10:by+5;R(x,7,belt,12,2,C.boot);R(x,12,belt,2,2,'#f0c860');
    if(pose==='jump'){R(x,15,by-5,3,7,C.tunD);E(x,16,by-6,2,2,SKIN)}else{R(x,15,by+2,3,big?9:5,C.tunD);E(x,16,by+(big?12:8),2,2,SKIN)}
    E(x,13,8,7,7,SKIN);
    const tail={stand:[[6,6],[1,9],[2,15],[6,11]],a:[[6,6],[0,6],[1,11],[6,10]],b:[[6,6],[0,8],[1,13],[6,10]],jump:[[6,5],[1,2],[0,7],[6,9]]}[pose];
    PG(x,C.curl?tail.map(([a,b])=>[a,b+2]):tail,C.hair);
    E(x,11,5,7,5,C.hair);R(x,5,4,5,8,C.hair);PG(x,[[9,1],[20,3],[20,6],[15,5],[11,7]],C.hair);R(x,10,2,5,1,C.hairL);R(x,8,4,1,4,C.hairL);
    R(x,16,7,2,3,OL);R(x,16,7,1,1,'#fff');R(x,18,11,2,1,'#f4908a');R(x,18,13,1,1,'#9a3a3a');
    if(C.rib){E(x,7,2,2,2,C.rib);E(x,3,3,2,2,C.rib);R(x,5,2,1,2,'#c84a80')}
  })}
const HERO=[0,1].map(hi=>{const r={};for(const pw of [0,1,2]){r[pw]={};for(const k of ['stand','a','b','jump'])r[pw][k]=heroImg(hi,pw>0,k,pw===2)}return r});

/* ---------------- Gegner, Frosch, Gegenstände ---------------- */
const SLIME=[sprite(20,16,x=>{E(x,10,10,9,6,'#4fb8f8');R(x,1,10,18,5,'#4fb8f8');R(x,2,13,16,2,'#2a7ac8');E(x,6,7,3,2,'#c8f0ff');E(x,7,9,2,3,'#fff');E(x,13,9,2,3,'#fff');R(x,8,9,1,3,OL);R(x,14,9,1,3,OL)}),
  sprite(20,16,x=>{E(x,10,11,9,5,'#4fb8f8');R(x,1,11,18,4,'#4fb8f8');R(x,2,13,16,2,'#2a7ac8');E(x,6,9,3,2,'#c8f0ff');E(x,7,10,2,2,'#fff');E(x,13,10,2,2,'#fff');R(x,8,10,1,2,OL);R(x,14,10,1,2,OL)})];
const SLIME_FLAT=sprite(20,16,x=>{E(x,10,13,9,2,'#4fb8f8');R(x,4,12,3,1,'#fff');R(x,13,12,3,1,'#fff')});
function beetle(f,bomb,hot){return sprite(24,20,x=>{
  if(!bomb){for(let i=0;i<3;i++){const o=(f+i)%2?1:-1;R(x,7+i*5+o,15,2,4,OL)}E(x,4,12,4,4,'#5a3a66');E(x,3,10,1,2,'#fff');R(x,3,11,1,1,OL)}
  E(x,13,9,10,7,hot?'#ffffff':'#d8463a');E(x,10,6,4,2,hot?'#ffe8a0':'#ff9a7a');E(x,16,8,2,2,'#ffd34a');E(x,11,11,2,2,'#ffd34a');R(x,3,14,20,2,hot?'#ffd34a':'#8e2a24');

function audioInit(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();AU.ctx=ctx;
  AU.master=ctx.createGain();AU.master.gain.value=.5;AU.master.connect(ctx.destination);
  AU.mus=ctx.createGain();AU.mus.gain.value=AU.music?.75:0;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;AU.mus.connect(lp);lp.connect(AU.master);
  const dl=ctx.createDelay(1);dl.delayTime.value=.19;const fb=ctx.createGain();fb.gain.value=.28;const wet=ctx.createGain();wet.gain.value=.3;
  lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(AU.master);
  AU.fx=ctx.createGain();AU.fx.gain.value=AU.sfx?1:0;AU.fx.connect(AU.master);
  const pw=d=>{const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++){re[k]=Math.sin(2*Math.PI*k*d)/(Math.PI*k);im[k]=(1-Math.cos(2*Math.PI*k*d))/(Math.PI*k)}return ctx.createPeriodicWave(re,im)};
  AU.w={12:pw(.125),25:pw(.25),50:pw(.5)};
  const nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;AU.noise=nb;

function tone(f,t0,dur,o={}){const ctx=AU.ctx;if(!ctx)return;const os=ctx.createOscillator();
  if(o.type)os.type=o.type;else os.setPeriodicWave(AU.w[o.wave||25]);os.frequency.setValueAtTime(f,t0);if(o.slide)os.frequency.exponentialRampToValueAtTime(o.slide,t0+dur);
  const gn=ctx.createGain(),v=o.vol||.1;gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(v,t0+.008);gn.gain.setTargetAtTime(v*.6,t0+.02,.08);gn.gain.setValueAtTime(v*.6,t0+Math.max(.02,dur-.03));gn.gain.linearRampToValueAtTime(0,t0+dur);
  os.connect(gn);gn.connect(o.dest||AU.fx);os.start(t0);os.stop(t0+dur+.05)}

   # Boden   = Stein   B Ziegel   ? Diamant-Kiste   U Kraft-Kiste   F Feuerblumen-Kiste

function builder(w){const m=Array.from({length:16},()=>Array(w).fill(' '));
  const o={m,w,plats:[],
    set(x,y,c){if(x>=0&&x<w&&y>=0&&y<16)m[y][x]=c},
    ground(a,b,top=14,c='#'){for(let x=a;x<=b;x++)for(let y=top;y<16;y++)o.set(x,y,c)},
    row(x,y,s){[...s].forEach((c,i)=>{if(c!=='.')o.set(x+i,y,c)})},
    rect(x0,y0,x1,y1,c){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)o.set(x,y,c)},
    pipe(x,h,base=14){const t=base-h;o.set(x,t,'[');o.set(x+1,t,']');for(let y=t+1;y<base;y++){o.set(x,y,'{');o.set(x+1,y,'}')}},
    stairs(x,n,dir=1,base=14){for(let i=0;i<n;i++){const hh=dir>0?i+1:n-i;for(let k=1;k<=hh;k++)o.set(x+i,base-k,'=')}},
    coins(x,y,n){for(let i=0;i<n;i++)o.set(x+i,y,'o')},
    lift(c,r,axis,a,b,sp=.5){o.plats.push({x:c*8,y:r*8,w:24,axis,a:a*8,b:b*8,sp,dir:1,dx:0,dy:0})},
    gate(c){o.gateX=c*8}};return o}

/* ---------------- Kachelzugriff & Physik ---------------- */
function tile(c,r){if(c<0||c>=CUR.w)return'=';if(r<0||r>=16)return' ';return CUR.tiles[r][c]}
function solid(c,r){return SOLID.has(tile(c,r))}
function colSolid(c,y,h){for(let r=fl(y/8);r<=fl((y+h-.01)/8);r++)if(solid(c,r))return true;return false}
function rowSolid(r,x,w){for(let c=fl(x/8);c<=fl((x+w-.01)/8);c++)if(solid(c,r))return true;return false}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function phys(o,grav=.25){let hit=false;o.x+=o.vx;
  if(o.vx>0){const c=fl((o.x+o.w-.01)/8);if(colSolid(c,o.y,o.h)){o.x=c*8-o.w;hit=true}}
  else if(o.vx<0){const c=fl(o.x/8);if(colSolid(c,o.y,o.h)){o.x=(c+1)*8;hit=true}}
  o.vy=Math.min(o.vy+grav,4);o.y+=o.vy;o.on=false;
  if(o.vy>0){const r=fl((o.y+o.h)/8);if(rowSolid(r,o.x,o.w)){o.y=r*8-o.h;o.vy=0;o.on=true}}
  else if(o.vy<0){const r=fl(o.y/8);if(rowSolid(r,o.x,o.w)){o.y=(r+1)*8;o.vy=0}}
  return hit}

function addDia(n=1){G.dia+=n;while(G.dia>=100){G.dia-=100;addLife(P.x,P.y)}}

/* ---------------- Kisten ---------------- */
function hitBlock(c,r){const ch=tile(c,r);
  if(ch==='?'){CUR.tiles[r][c]='X';L.bumps.push({c,r,t:8});CUR.items.push({type:'pop',x:c*8,y:r*8-8,vy:-3,t:22});addDia();score(200);SFX.coin();kickTop(c,r)}
  else if(ch==='U'||ch==='F'){CUR.tiles[r][c]='X';L.bumps.push({c,r,t:8});kickTop(c,r);
    const type=ch==='F'||P.power>0?'flower':'potion';CUR.items.push({type,x:c*8,y:r*8,w:8,h:8,vx:0,vy:0,emerge:16});SFX.appear()}
  else if(ch==='B'){if(P.power>0){CUR.tiles[r][c]=' ';debris(c,r);score(50);SFX.brk();kickTop(c,r)}else{L.bumps.push({c,r,t:8});SFX.bump();kickTop(c,r)}}
  else if(ch==='M'||ch==='Q'){L.bumps.push({c,r,t:8});SFX.bump();kickTop(c,r);CUR.tiles[r][c]='X';
    const box=CUR.boxes.find(b=>b.c===c&&b.r===r),n=CUR.boxes.indexOf(box)+1;
    ask(ch==='Q'?'Σ-Kiste: Brücke reparieren':'Σ-Kiste '+n+' von '+CUR.boxes.length,ok=>{
      CUR.tiles[r][c]=ok?'G':'R';if(box)box.res=ok;burst(c*8+4,r*8+4,14,ok?['#5cf06a','#fff']:['#ff6a5a','#fff']);
      if(ok){score(1000,c*8-4,r*8-10);CUR.items.push({type:'frog',x:c*8-1,y:r*8,w:10,h:9,vx:0,vy:0,emerge:18,hop:20});SFX.frog()}
      if(ch==='Q'){L.bridge.on=true;L.bridge.t=0}})}
  else SFX.bump()}
function kickTop(c,r){const box={x:c*8,y:r*8-4,w:8,h:4};for(const e of CUR.enemies)if(!e.dead&&e.active&&overlap(box,e))killFlip(e,200)}
function killFlip(e,pts){e.dead=true;e.vy=-2.5;e.vx=e.x<P.x?-.6:.6;score(pts,e.x,e.y-6);SFX.stomp()}

/* ---------------- Fragefenster (eine Antwort pro Kiste) ---------------- */
let qOrder=[],qi=0,quizVersion=0,quizDone=null,quizOk=false;
const qEl=document.getElementById('quiz'),ansEl=document.getElementById('answers'),resEl=document.getElementById('result'),nextBtn=document.getElementById('next');
function resetQuestions(){qOrder=QUESTIONS.map((_,i)=>i);if(SETTINGS.shuffle)for(let i=qOrder.length-1;i>0;i--){const j=fl(Math.random()*(i+1));[qOrder[i],qOrder[j]]=[qOrder[j],qOrder[i]]}qi=0}
function plain(el){el.innerHTML=el.innerHTML.replace(/\^\{\\prime\\prime\}/g,'″').replace(/\^\{\\prime\}/g,'′').replace(/\\[()]/g,'').replace(/\\prime/g,'′').replace(/\^\{([^}]*)\}/g,'^$1').replace(/_\{([^}]*)\}/g,'_$1').replace(/\\quad/g,'  ').replace(/\\cdot/g,'·').replace(/\\pi/g,'π').replace(/\\partial/g,'∂').replace(/\\leq/g,'≤').replace(/\\int/g,'∫').replace(/\\frac\{d\}\{dt\}/g,'d/dt ').replace(/\\sin/g,'sin').replace(/\\cos/g,'cos').replace(/\\[a-zA-Z]+/g,'')}
let mjFailed=false;setTimeout(()=>{if(!(window.MathJax&&MathJax.typesetPromise))mjFailed=true},9000);
function typeset(el){if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetClear&&MathJax.typesetClear([el]);return MathJax.typesetPromise([el]).catch(()=>{})}if(mjFailed)plain(el);return Promise.resolve()}
function ask(title,done){quizOpen=true;quizDone=done;for(const k in held)held[k]=false;duck(true);
  if(!qOrder.length)resetQuestions();const q=QUESTIONS[qOrder[qi++%qOrder.length]];G.asked++;
  document.getElementById('qtitle').textContent=title;document.getElementById('qtype').textContent=q.type||'';
  document.getElementById('question').innerHTML=q.q;resEl.className='';resEl.innerHTML='';nextBtn.className='';ansEl.innerHTML='';
  q.a.forEach((v,i)=>{const b=document.createElement('button');b.innerHTML='<b>'+'ABCD'[i]+'</b>'+v;b.onclick=()=>answer(q,i);ansEl.append(b)});
  qEl.classList.add('open');const ver=++quizVersion;
  const render=(n=0)=>{if(ver!==quizVersion)return;if(window.MathJax&&MathJax.typesetPromise)typeset(qEl);
    else if(n<40&&!mjFailed)setTimeout(()=>render(n+1),200);else{mjFailed=true;plain(document.getElementById('question'));[...ansEl.children].forEach(plain)}};render();
  const f=ansEl.querySelector('button');f&&f.focus({preventScroll:true})}
function answer(q,i){const btns=[...ansEl.children];if(btns[0].disabled)return;btns.forEach(b=>b.disabled=true);quizOk=i===q.ok;
  btns[q.ok].classList.add('right');if(!quizOk)btns[i].classList.add('wrong');
  if(quizOk){G.right++;SFX.ok()}else{G.perfect=false;SFX.no()}
  resEl.className=quizOk?'ok':'bad';
  resEl.innerHTML='<strong>'+(quizOk?'RICHTIG! ✓':'LEIDER FALSCH')+'</strong>'+(quizOk?'':'Richtig ist <b>'+'ABCD'[q.ok]+'</b>. ')+(q.why||'');
  typeset(resEl);nextBtn.className='show';nextBtn.focus({preventScroll:true});resEl.scrollIntoView({block:'nearest'})}
nextBtn.addEventListener('click',()=>{qEl.classList.remove('open');quizOpen=false;duck(false);for(const k in held)held[k]=false;const d=quizDone;quizDone=null;d&&d(quizOk)});

/* ---------------- Spielerin ---------------- */
function hurt(){if(P.inv||P.freeze)return;if(P.power>0){setPower(0);P.inv=120;P.freeze=36;P.frz='shrink';SFX.hurt()}else die()}
function die(){state='dying';T=0;P.vx=0;P.vy=0;jingle('death')}
function updatePlayer(){const p=P;
  if(p.ride){p.x+=p.ride.dx;p.y+=p.ride.dy}
  const dir=(held.right?1:0)-(held.left?1:0),run=held.b,max=(run?1.7:1.0)*(G.hero===0?1.12:1);
  if(dir){p.face=dir;const acc=p.on?(Math.sign(p.vx)===-dir?.13:.06):.05;p.vx+=dir*acc;if(Math.abs(p.vx)>max)p.vx-=Math.sign(p.vx)*.05}
  else{const fr=p.on?.07:.01;p.vx=Math.abs(p.vx)<=fr?0:p.vx-Math.sign(p.vx)*fr}
  if(p.on)p.coyote=5;else if(p.coyote>0)p.coyote--;
  if(jumpTap())p.buf=5;else if(p.buf>0)p.buf--;
  if(p.buf&&p.coyote&&!(held.down&&onWarp())){p.vy=-(3.4+Math.abs(p.vx)*.24+(G.hero===1?.35:0));p.on=false;p.coyote=0;p.buf=0;p.ride=null;SFX.jump()}
  const grav=p.vy<0?(jumpHeld()?.16:.42):.3;p.vy=Math.min(p.vy+grav,3.8);
  if(tap.b&&p.power===2&&L.balls.length<2){L.balls.push({x:p.x+(p.face>0?p.w:-4),y:p.y+5,w:4,h:4,vx:2.1*p.face,vy:2,t:0});SFX.fire()}
  p.x+=p.vx;
  if(p.vx>0){const c=fl((p.x+p.w-.01)/8);if(colSolid(c,p.y,p.h)){p.x=c*8-p.w;p.vx=0}}
  else if(p.vx<0){const c=fl(p.x/8);if(colSolid(c,p.y,p.h)){p.x=(c+1)*8;p.vx=0}}
  if(p.x<L.cam){p.x=L.cam;if(p.vx<0)p.vx=0}
  if(p.x>Math.min(CUR.w*8,L.cam+VW)-p.w){p.x=Math.min(CUR.w*8,L.cam+VW)-p.w;if(p.vx>0)p.vx=0}
  const oldBottom=p.y+p.h-(p.ride?p.ride.dy:0);p.y+=p.vy;p.on=false;p.ride=null;
  if(p.vy>0){const r=fl((p.y+p.h)/8);if(rowSolid(r,p.x,p.w)){p.y=r*8-p.h;p.vy=0;p.on=true}}
  else if(p.vy<0){const r=fl(p.y/8),c0=fl(p.x/8),c1=fl((p.x+p.w-.01)/8);
    if(solid(c0,r)||solid(c1,r)){p.y=(r+1)*8;p.vy=.5;const mid=fl((p.x+p.w/2)/8);hitBlock(solid(mid,r)?mid:(solid(c0,r)?c0:c1),r)}}
  for(const pl of CUR.plats){if(p.vy>=0&&p.x+p.w>pl.x&&p.x<pl.x+pl.w&&oldBottom<=pl.y+1.5&&p.y+p.h>=pl.y){p.y=pl.y-p.h;p.vy=0;p.on=true;p.ride=pl}}
  if(p.on)p.chain=0;p.anim+=p.on?Math.abs(p.vx)*.18:0;if(p.inv>0)p.inv--;
  for(let r=fl(p.y/8);r<=fl((p.y+p.h-1)/8);r++)for(let c=fl(p.x/8);c<=fl((p.x+p.w-1)/8);c++)if(tile(c,r)==='o'){CUR.tiles[r][c]=' ';addDia();score(50);SFX.coin()}
  const mc=fl((p.x+p.w/2)/8);
  if(p.y+p.h>119&&tile(mc,14)==='b'){burst(p.x+4,GROUND+4,10,['#8cd0ff','#fff']);die();return}
  if(p.y>VH){die();return}
  if(held.down&&p.on&&onWarp()&&!L.pipeAnim)enterPipe()}
function onWarp(){if(CUR===L.main&&CUR.warp){const c=CUR.warp.enter;return P.on&&P.x+P.w/2>c*8+2&&P.x+P.w/2<c*8+14&&Math.abs(P.y+P.h-96)<1}
  if(CUR===L.bonus)return P.on&&P.x+P.w/2>16*8+2&&P.x+P.w/2<16*8+14&&Math.abs(P.y+P.h-96)<1;return false}
function enterPipe(){P.vx=0;L.pipeAnim={t:0,dir:1};SFX.pipe()}
function finishPipe(){if(CUR===L.main){CUR=L.bonus;L.camSave=L.cam;L.cam=0;P.x=CUR.start.x;P.y=CUR.start.y-P.h;P.vy=0;playSong('elise')}
  else{CUR=L.main;const c=CUR.warp.exit;P.x=c*8+4;P.y=96-P.h+16;P.vy=0;L.cam=Math.max(0,Math.min(CUR.w*8-VW,P.x-72));L.pipeAnim={t:0,dir:-1};SFX.pipe();playSong(L.def.song)}}

/* ---------------- Gegner, Gegenstände, Bälle ---------------- */
function updateEnemies(){const pbox={x:P.x+1,y:P.y+1,w:P.w-2,h:P.h-1};
  for(const e of CUR.enemies){
    if(e.dead){e.vy+=.2;e.y+=e.vy;e.x+=e.vx;if(e.y>170)e.gone=true;continue}
    e.active=e.x>L.cam-32&&e.x<L.cam+VW+8;if(!e.active)continue;
    if(e.flat){if(--e.flat<=0)e.gone=true;continue}
    e.t=(e.t||0)+1;
    if(e.type==='bat'){e.x+=e.vx;e.y=e.by+Math.sin(e.t*.06)*10}
    else if(e.bomb!==undefined){e.vx=0;phys(e);if(--e.bomb<=0){explode(e);continue}}
    else{if(phys(e))e.vx=-e.vx;if(e.type==='beetle'&&e.on){const ahead=e.vx>0?fl((e.x+e.w+1)/8):fl((e.x-1)/8);if(!solid(ahead,fl((e.y+e.h+2)/8)))e.vx=-e.vx}}
    if(e.y>VH+10){e.gone=true;continue}
    if(state==='play'&&overlap(pbox,e)&&e.bomb===undefined){
      const stomp=P.vy>.3&&(P.y+P.h-P.vy)<=e.y+4;
      if(stomp){P.vy=jumpHeld()?-4.2:-2.8;P.chain++;const pts=[100,200,400,800,1000][Math.min(P.chain-1,4)];
        if(e.type==='slime'){e.flat=30;score(pts,e.x,e.y-6);SFX.stomp()}else if(e.type==='beetle'){e.bomb=110;score(pts,e.x,e.y-6);SFX.stomp()}else killFlip(e,pts)}
      else hurt()}}
  CUR.enemies=CUR.enemies.filter(e=>!e.gone)}
function explode(e){e.gone=true;SFX.boom();const cx=e.x+6,cy=e.y+5;burst(cx,cy,26,['#ffd23a','#ff6a2a','#fff'],2.2);
  if(Math.hypot(P.x+4-cx,P.y+P.h/2-cy)<18)hurt();for(const o of CUR.enemies)if(o!==e&&!o.dead&&Math.hypot(o.x+5-cx,o.y+4-cy)<20)killFlip(o,200)}
function updateItems(){for(const it of CUR.items){
    if(it.type==='pop'){it.y+=it.vy;it.vy+=.25;if(--it.t<=0){it.gone=true;L.pops.push({x:it.x-2,y:it.y,txt:'200',t:30})}continue}
    if(it.emerge>0){it.y-=.5;it.emerge--;if(!it.emerge&&it.type==='potion')it.vx=.6;continue}
    if(it.type==='frog'){it.hop--;it.life=(it.life||0)+1;const dx=(P.x+4)-(it.x+5),dy=(P.y+P.h/2)-(it.y+4);
      if(it.life>300){const dd=Math.hypot(dx,dy)||1;it.x+=dx/dd*2.5;it.y+=dy/dd*2.5;it.face=Math.sign(dx)||1;if(dd<6){it.gone=true;addLife(it.x,it.y);burst(it.x+5,it.y+4,12,['#5cf06a','#fff'])}continue}
      if(it.on&&it.hop<=0){const sg=Math.sign(dx)||1;it.vx=sg*Math.max(.8,Math.min(1.5,Math.abs(dx)*.04));it.vy=-3;it.hop=24;it.face=sg}
      phys(it,.2);if(it.on)it.vx*=.8;if(it.y>VH){it.gone=true;addLife(P.x,P.y);continue}
      if(overlap(it,P)){it.gone=true;addLife(it.x,it.y);burst(it.x+5,it.y+4,12,['#5cf06a','#fff'])}continue}
    if(it.type==='potion'){if(phys(it))it.vx=-it.vx;if(it.y>VH)it.gone=true}
    if(overlap(it,P)&&state==='play'){it.gone=true;score(1000,it.x,it.y-6);
      if(it.type==='potion'){if(P.power===0){setPower(1);P.freeze=40;P.frz='grow'}SFX.power()}
      else{const was=P.power;setPower(2);P.freeze=was===0?40:24;P.frz='grow';SFX.power()}}}
  CUR.items=CUR.items.filter(i=>!i.gone)}
function updateBalls(){for(const b of L.balls){b.t++;
    b.x+=b.vx;if(solid(fl((b.x+2)/8),fl((b.y+2)/8))){b.x-=b.vx;b.vx=-b.vx}
    b.y+=b.vy;if(solid(fl((b.x+2)/8),fl((b.y+2)/8))){b.y-=b.vy;b.vy=-b.vy}
    const c=fl((b.x+2)/8),r=fl((b.y+2)/8);if(tile(c,r)==='o'){CUR.tiles[r][c]=' ';addDia();score(50);SFX.coin()}
    for(const e of CUR.enemies)if(e.active&&!e.dead&&!e.flat&&overlap(b,e)){killFlip(e,200);delete e.bomb;b.gone=true;break}
    const d=L.dragon;if(d&&L.arena&&!d.dying&&!b.gone&&overlap(b,d)){b.gone=true;burst(b.x,b.y,6);if(!d.inv)hitDragon()}
    if(b.x<L.cam-8||b.x>L.cam+VW+8||b.y>VH||b.t>420)b.gone=true}
  L.balls=L.balls.filter(b=>!b.gone)}
function updatePlats(){for(const p of CUR.plats){const ox=p.x,oy=p.y;
  if(p.axis==='x'){p.x+=p.sp*p.dir;if(p.x>p.b||p.x<p.a)p.dir*=-1}else{p.y+=p.sp*p.dir;if(p.y>p.b||p.y<p.a)p.dir*=-1}p.dx=p.x-ox;p.dy=p.y-oy}}

/* ---------------- Drache ---------------- */
function hitDragon(){const d=L.dragon;d.inv=150;SFX.boom();burst(d.x+14,d.y+8,16);
  ask('Drachenmagie: Regeneration verhindern',ok=>{
    if(ok){d.hp--;score(1000,d.x+6,d.y-8);burst(d.x+14,d.y+10,20,['#ff6a2a','#ffd23a']);MUS.rate=1+(3-d.hp)*.22;
      if(d.hp<=0){d.dying=1;stopSong();SFX.boom();score(5000,d.x+4,d.y-16);L.dfire=[]}}
    else{L.pops.push({x:d.x-10,y:d.y-12,txt:'REGENERIERT!',t:80,col:'#ff8a7a'});burst(d.x+14,d.y+8,16,['#5cf06a','#fff'])}})}
function updateDragon(){const d=L.dragon;if(!d)return;
  if(!L.arena){if(P.x>CUR.arena+24){L.arena=true;MUS.name=null;playSong('king')}else return}
  if(d.dying){d.dying++;if(d.dying%6===0){burst(d.x+Math.random()*28,d.y+Math.random()*24,8,['#ff6a2a','#ffd23a','#fff'],2);SFX.boom()}
    if(d.dying>150){if(CUR.boxes.some(b=>b.res===null))G.perfect=false;G.stars[2]=CUR.boxes.every(b=>b.res===true);state='bossclear';T=0;jingle('win');saveHi()}return}
  d.t++;if(d.inv>0)d.inv--;d.face=P.x+4<d.x+14?-1:1;
  if(!d.mouth){d.x+=d.vx*(1+(3-d.hp)*.25);const minX=CUR.arena+56,maxX=CUR.arena+VW-8-d.w;if(d.x<minX){d.x=minX;d.vx=.4}if(d.x>maxX){d.x=maxX;d.vx=-.4}}
  d.vy+=.2;d.y+=d.vy;if(d.y>GROUND-d.h){d.y=GROUND-d.h;d.vy=0}
  if(d.t%170===85&&d.y>=GROUND-d.h-.1)d.vy=-3.2;if(d.t%120===0)d.mouth=24;
  if(d.mouth){d.mouth--;if(d.mouth===12){const low=d.shotLow;d.shotLow=!d.shotLow;L.dfire.push({x:d.face<0?d.x-6:d.x+d.w-2,y:low?GROUND-9:GROUND-21,w:8,h:6,vx:1.5*d.face});SFX.fire()}}
  for(const f of L.dfire){f.x+=f.vx;if(overlap(f,{x:P.x+1,y:P.y+1,w:P.w-2,h:P.h-2}))hurt();if(f.x<L.cam-10||f.x>L.cam+VW+10)f.gone=true}
  L.dfire=L.dfire.filter(f=>!f.gone);
  if(overlap({x:P.x,y:P.y,w:P.w,h:P.h},d)){const stomp=P.vy>.3&&(P.y+P.h-P.vy)<=d.y+6;
    if(stomp){P.vy=-3.6;P.vx=(P.x+4<d.x+14?-1.4:1.4);if(!d.inv)hitDragon()}else if(d.inv<110){hurt();P.vx=(P.x+4<d.x+14?-1.5:1.5)}}}

/* ---------------- Ziel mit Band ---------------- */
function checkGoal(){const gx=CUR.gateX;if(!gx)return;const t=L.tape;t.y+=.7*t.dir;if(t.y>104||t.y<24)t.dir*=-1;
  const tb={x:gx+4,y:t.y,w:36,h:3};
  if(overlap(P,tb)){const pts=Math.max(1,Math.round((104-t.y)/80*50))*100;score(pts,P.x,P.y-10);SFX.tape();if(t.y<38)addLife(P.x,P.y-12);clearLevel(true);return}
  if(P.x+P.w/2>gx+22)clearLevel(false)}
function clearLevel(tape){state='clear';T=0;L.tape.hit=tape;jingle('clear');
  const bx=CUR===L.main?L.main.boxes:[];const total=bx.length,right=bx.filter(b=>b.res===true).length;
  const perfect=total>0&&right===total;if(total&&!perfect)G.perfect=false;if(perfect&&G.lvl<3)G.stars[G.lvl]=true;
  L.tally={phase:0,total,right,perfect,timeBonus:0,given:false,wait:0}}
function saveHi(){if(G.score>G.hi){G.hi=G.score;try{localStorage.setItem('mms_hi',G.hi)}catch(e){}}}

/* ---------------- Hauptschritt ---------------- */
function updatePlay(){
  if(P.freeze){P.freeze--;return}
  if(L.pipeAnim){const a=L.pipeAnim;a.t++;P.y+=.5*a.dir;if(a.t>=32){L.pipeAnim=null;if(a.dir>0)finishPipe()}return}
  tick++;updatePlats();updatePlayer();if(state!=='play')return;
  if(CUR===L.main&&!L.arena){const tgt=P.x+P.w/2-(P.face>0?64:96);L.cam+=(tgt-L.cam)*.1;L.cam=Math.max(0,Math.min(CUR.w*8-VW,L.cam))}
  else if(L.arena)L.cam=Math.min(CUR.arena,L.cam+1);
  updateEnemies();updateItems();updateBalls();updateDragon();if(state!=='play')return;
  if(L.bridge.on){L.bridge.t++;if(L.bridge.t%5===0){for(let c=98;c<=107;c++)if(L.main.tiles[14][c]==='b'){L.main.tiles[14][c]='P';SFX.blip();burst(c*8+4,GROUND+2,3,['#d09050']);break}}}
  if(++L.tAcc>=24){L.tAcc=0;if(L.time>0)L.time--;if(L.time===100&&!L.hurry){L.hurry=true;MUS.rate*=1.3;SFX.pause()}if(L.time<=0){die();return}}
  if(CUR.gateX)checkGoal()}
function updateFx(){for(const q of L.parts){q.x+=q.vx;q.y+=q.vy;q.vy+=q.grav;q.t--}L.parts=L.parts.filter(q=>q.t>0);

/* ---------------- Schleife & Layout ---------------- */
let acc=0,last=performance.now();
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){step();acc-=1000/60}render();requestAnimationFrame(loop)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!paused&&!quizOpen){paused=true;duck(true)}});
function layout(){const touch=matchMedia('(pointer:coarse)').matches,W=innerWidth,H=innerHeight,port=H>W;
  let aw=W-16,ah=H-(touch?16:70);if(touch&&port){ah=H*.58-50}else if(touch){aw=W-2*Math.min(190,W*.25)}
  let s=Math.min(aw/320,ah/288);if(s>=2)s=fl(s);s=Math.max(.5,s);cv.style.width=fl(320*s)+'px';cv.style.height=fl(288*s)+'px';
  const app=document.getElementById('app');app.style.justifyContent=touch&&port?'flex-start':'center';app.style.paddingTop=touch&&port?'calc(env(safe-area-inset-top,0px) + 52px)':'';
  const pd=document.getElementById('pad').style,ab=document.getElementById('ab').style,mt=document.getElementById('meta').style;
  if(port){pd.left='20px';pd.bottom='calc(env(safe-area-inset-bottom,0px) + 86px)';ab.right='16px';ab.bottom='calc(env(safe-area-inset-bottom,0px) + 96px)';
    mt.left='50%';mt.transform='translateX(-50%)';mt.top='auto';mt.bottom='calc(env(safe-area-inset-bottom,0px) + 24px)'}
  else{pd.left='max(14px,env(safe-area-inset-left,0px))';pd.bottom='calc(env(safe-area-inset-bottom,0px) + 22px)';ab.right='max(14px,env(safe-area-inset-right,0px))';ab.bottom='calc(env(safe-area-inset-bottom,0px) + 34px)';
    mt.left='max(12px,env(safe-area-inset-left,0px))';mt.transform='none';mt.top='calc(env(safe-area-inset-top,0px) + 8px)';mt.bottom='auto'}}
addEventListener('resize',layout);setMusic(AU.music);setSfx(AU.sfx);layout();requestAnimationFrame(loop);
