<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Magic Math Sisters</title><style>body{margin:0;background:#10152b;color:white;font-family:system-ui;text-align:center}h2{margin:12px}canvas{max-width:100%;image-rendering:pixelated;background:#8bd5ee;border:3px solid #eee}button{font-size:18px;padding:12px;margin:4px;border:0;border-radius:9px;background:#e7d5ff}#quiz{display:none;position:fixed;inset:8% 5%;background:#172044;border:3px solid #ffdf73;border-radius:16px;padding:18px;overflow:auto;z-index:3}#answers button{display:block;width:90%;margin:9px auto}#controls{display:flex;justify-content:space-around}#controls button{min-width:60px}small{display:block;margin:8px}</style><h2>✨ Magic Math Sisters ✨</h2><div id="hud">Helga · Diamanten: 0 · Feuer: nein</div><canvas id="game" width="960" height="480"></canvas><div id="controls"><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button><button data-key="Space">⤒</button><button id="switch">Wechseln</button><button data-key="KeyF">🔥</button></div><small>← → laufen · Leertaste springen · E Schwester wechseln · F Feuerball · R Neustart</small><div id="quiz"><h2 id="qt"></h2><p id="question"></p><div id="answers"></div><p id="feedback"></p></div><script>
const c=document.getElementById('game'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const questions=[
{type:'Rechnen',q:'y′(t)+2y(t)=0, y(0)=3. Welche Lösung ist richtig?',a:['3e^(2t)','3e^(-2t)','e^(-2t)+2','3−2t'],ok:1,why:'Trennung der Variablen ergibt y(t)=Ce^(-2t); aus y(0)=3 folgt C=3.'},
{type:'Verständnis',q:'Welche Aussage ist für y′=f(t,y) bei lokal Lipschitz-stetigem f bezüglich y richtig?',a:['Es gibt nie Lösungen.','Lokale Lösungen sind eindeutig.','Alle Lösungen sind periodisch.','Jede Lösung ist global beschränkt.'],ok:1,why:'Der Satz von Picard–Lindelöf garantiert lokale Existenz und Eindeutigkeit.'},
{type:'Rechnen',q:'Welche Funktion löst y′′−3y′+2y=0 NICHT?',a:['e^t','e^(2t)','e^(3t)','4e^t−2e^(2t)'],ok:2,why:'Das charakteristische Polynom (λ−1)(λ−2) hat nur die Nullstellen 1 und 2.'},
{type:'Verständnis',q:'Was gilt für y′=−5y und y(0)=2?',a:['Die Lösung wächst unbegrenzt.','Die Nulllösung ist asymptotisch stabil.','Die Lösung ist periodisch.','Die Lösung erreicht 0 nach endlicher Zeit.'],ok:1,why:'y(t)=2e^(−5t) konvergiert für t→∞ gegen 0.'},
{type:'Rechnen',q:'Welche Funktion löst u_t=u_xx auf (0,π) mit u=0 an beiden Rändern?',a:['e^(−4t) sin(2x)','e^(4t) sin(2x)','e^(−2t) sin(2x)','e^(−4t) cos(2x)'],ok:0,why:'Für sin(2x) gilt die zweite Ableitung −4sin(2x).'},
{type:'Verständnis',q:'Welche Aussage zur Wärmeleitungsgleichung mit homogenen Dirichlet-Randwerten ist richtig?',a:['Jede Lösung ist zeitlich periodisch.','Die Energie ∫|u|² kann nicht wachsen.','Die Lösung muss räumlich konstant sein.','Es gibt keine stationären Lösungen.'],ok:1,why:'Multiplikation mit u und partielle Integration liefert d/dt ∫|u|²=−2∫|u_x|²≤0.'},
{type:'Rechnen',q:'Bestimme die Eigenwerte der Matrix diag(−1,2).',a:['−1 und 2','1 und −2','−2 und 1','0 und 1'],ok:0,why:'Bei einer Diagonalmatrix stehen die Eigenwerte auf der Diagonale.'},
{type:'Verständnis',q:'Welche Aussage über u_tt=c²u_xx ist richtig?',a:['Es beschreibt Wärmeleitung.','c ist eine Ausbreitungsgeschwindigkeit.','Alle Lösungen zerfallen exponentiell.','Randbedingungen sind immer unnötig.'],ok:1,why:'Die Wellengleichung beschreibt Ausbreitung mit endlicher Geschwindigkeit c.'}
];
let keys={},hero=0,diamonds=0,fire=false,bridge=false,gate=false,boss=false,paused=false,active=null,qi=0,shots=[],enemies=[],gems=[];
const W=2700,ground=390;let p={x:50,y:330,vx:0,vy:0,on:false};
function reset(){hero=0;diamonds=0;fire=false;bridge=false;gate=false;boss=false;paused=false;qi=0;p={x:50,y:330,vx:0,vy:0,on:false};shots=[];enemies=[{x:690,alive:true},{x:1480,alive:true},{x:2120,alive:true}];gems=Array.from({length:23},(_,i)=>({x:160+i*102,y:310-(i%3)*35,taken:false}));hud()}
function hud(){document.getElementById('hud').textContent=`${hero?'Emmy':'Helga'} · Diamanten: ${diamonds} · Feuer: ${fire?'ja':'nein'} · Brücke: ${bridge?'offen':'gesperrt'}`}
function ask(title,done){paused=true;active=done;let q=questions[qi++%questions.length];document.getElementById('quiz').style.display='block';document.getElementById('qt').textContent=title+' · '+q.type;document.getElementById('question').textContent=q.q;document.getElementById('feedback').textContent='';let a=document.getElementById('answers');a.innerHTML='';q.a.forEach((v,i)=>{let b=document.createElement('button');b.textContent='ABCD'[i]+') '+v;b.onclick=()=>{if(i===q.ok){document.getElementById('feedback').textContent='✓ Richtig! '+q.why;[...a.children].forEach(x=>x.disabled=true);setTimeout(()=>{document.getElementById('quiz').style.display='none';paused=false;done();hud()},1100)}else{document.getElementById('feedback').textContent='Noch nicht. Hinweis: '+q.why}};a.append(b)})}
function platforms(){return [{x:350,y:315,w:150},{x:850,y:300,w:140},{x:1280,y:320,w:150},{x:1760,y:290,w:180},{x:2300,y:315,w:130}]}
function update(){if(paused)return;let speed=hero?4.2:5.3;p.vx=((keys.ArrowRight||keys.KeyD)?speed:0)-((keys.ArrowLeft||keys.KeyA)?speed:0);if((keys.Space||keys.ArrowUp||keys.KeyW)&&p.on){p.vy=hero?-13:-12;p.on=false}let oldBottom=p.y+38;p.vy+=.58;p.x=Math.max(0,Math.min(W-35,p.x+p.vx));p.y+=p.vy;p.on=false;let onGap=p.x>1040&&p.x<1220&&!bridge;if(p.y+38>=ground&&!onGap&&oldBottom<=ground+15&&p.vy>=0){p.y=ground-38;p.vy=0;p.on=true}for(let b of platforms())if(p.x+27>b.x&&p.x<b.x+b.w&&oldBottom<=b.y+8&&p.y+38>=b.y&&p.vy>=0){p.y=b.y-38;p.vy=0;p.on=true}if(p.y>550){p.x=Math.max(40,p.x-160);p.y=250;p.vy=0}for(let d of gems)if(!d.taken&&Math.abs(p.x-d.x)<28&&Math.abs(p.y-d.y)<40){d.taken=true;diamonds++;hud()}for(let e of enemies)if(e.alive&&Math.abs(p.x-e.x)<27&&Math.abs(p.y+20-(ground-20))<35){p.x=Math.max(0,p.x-90);p.vy=-8}for(let s of shots){s.x+=11;for(let e of enemies)if(e.alive&&Math.abs(s.x-e.x)<25)e.alive=false}shots=shots.filter(s=>s.x<p.x+750);if(!fire&&p.x>460)ask('🔥 Feuertransformation',()=>fire=true);else if(!bridge&&p.x>965)ask('🌉 Brücke reparieren',()=>bridge=true);else if(!gate&&p.x>1660)ask('🚪 Magisches Tor',()=>gate=true);else if(!boss&&p.x>2470)ask('👹 Endgegner – Runde 1',()=>ask('👹 Endgegner – Runde 2',()=>ask('👹 Endgegner – Finale',()=>{boss=true;alert('🏆 Level geschafft! Helga und Emmy haben die Differentialgleichungen besiegt!')})))}
function draw(){let cam=Math.max(0,Math.min(W-960,p.x-220));g.clearRect(0,0,960,480);let sky=g.createLinearGradient(0,0,0,480);sky.addColorStop(0,'#6e8ce7');sky.addColorStop(1,'#b9f5ed');g.fillStyle=sky;g.fillRect(0,0,960,480);for(let i=0;i<26;i++){let x=i*130-cam*.3;g.fillStyle='#8dc7ba';g.beginPath();g.arc(x,365,90,Math.PI,0);g.fill()}for(let i=0;i<30;i++){let x=i*105-cam*.65;g.fillStyle='#466e65';g.fillRect(x,220+(i%3)*25,18,180);g.fillStyle='#2d8667';g.beginPath();g.arc(x+9,220+(i%3)*25,40,0,Math.PI*2);g.fill()}g.fillStyle='#624d77';g.fillRect(-cam,ground,W,90);g.fillStyle='#55bc79';g.fillRect(-cam,ground,W,12);if(!bridge){g.clearRect(1040-cam,ground,180,90);g.fillStyle='#203452';g.fillRect(1040-cam,ground,180,90)}else{g.fillStyle='#e4a94b';g.fillRect(1040-cam,ground-6,180,15)}for(let b of platforms()){g.fillStyle='#665c90';g.fillRect(b.x-cam,b.y,b.w,20);g.fillStyle='#75d48e';g.fillRect(b.x-cam,b.y,b.w,7)}for(let d of gems)if(!d.taken){g.fillStyle='#f7e26e';g.beginPath();g.moveTo(d.x-cam,d.y-13);g.lineTo(d.x+10-cam,d.y);g.lineTo(d.x-cam,d.y+13);g.lineTo(d.x-10-cam,d.y);g.fill()}for(let e of enemies)if(e.alive){g.fillStyle='#b3549a';g.fillRect(e.x-cam,ground-32,30,32);g.fillStyle='white';g.fillRect(e.x+7-cam,ground-24,5,5);g.fillRect(e.x+20-cam,ground-24,5,5)}for(let [x,symbol] of [[460,'🔥'],[985,'?'],[1680,'🚪'],[2490,'👹']]){g.font='35px system-ui';g.fillText(symbol,x-cam,ground-52)}g.fillStyle=hero?'#f2b95b':'#d655a4';g.fillRect(p.x-cam,p.y+12,28,26);g.fillStyle=hero?'#673b31':'#e7c14f';g.fillRect(p.x-cam-2,p.y,32,19);g.fillStyle='white';g.fillRect(p.x+18-cam,p.y+16,5,5);g.fillStyle='#30304b';g.fillRect(p.x+20-cam,p.y+17,2,3);for(let s of shots){g.fillStyle='#ff9c27';g.beginPath();g.arc(s.x-cam,s.y,8,0,7);g.fill()}g.font='18px system-ui';g.fillStyle='#152d43';g.fillText('Wald der Anfangswerte',20,32);requestAnimationFrame(frame)}
function frame(){update();draw()}document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyE'){hero=1-hero;hud()}if(e.code==='KeyF'&&fire&&!paused)shots.push({x:p.x+28,y:p.y+23});if(e.code==='KeyR')reset()});document.addEventListener('keyup',e=>keys[e.code]=false);document.getElementById('switch').onclick=()=>{hero=1-hero;hud()};document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;if(k==='KeyF'&&fire&&!paused)shots.push({x:p.x+28,y:p.y+23})});for(let ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>keys[k]=false)});reset();frame();
</script></html>
