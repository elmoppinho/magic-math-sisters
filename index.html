<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Magic Math Sisters</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11172e;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#101b36}canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}#hud{position:fixed;top:env(safe-area-inset-top,0px);left:12px;z-index:2;padding:7px 12px;background:#101a34b8;border:1px solid #ffffff44;border-radius:12px;font-size:clamp(11px,1.8vw,17px);pointer-events:none}#controls{position:fixed;inset:0;z-index:2;pointer-events:none}#dpad{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:9px;align-items:center}#actions{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:15px}.ctrl{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:rgba(21,33,65,.38);border:2px solid rgba(255,255,255,.45);box-shadow:0 3px 18px #0003,inset 0 1px 4px #fff2;color:white;border-radius:24px;width:clamp(60px,11vh,92px);height:clamp(60px,11vh,92px);font-size:clamp(22px,5vh,36px);font-weight:800;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}.ctrl:active,.ctrl.pressed{background:rgba(255,215,108,.55);transform:scale(.96)}#jump{width:clamp(70px,15vh,110px);height:clamp(70px,15vh,110px);border-radius:50%}#fire{border-radius:50%}#switch{position:fixed;right:max(20px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:2;pointer-events:auto;border:1px solid #fff8;background:#162c58ad;color:white;border-radius:14px;padding:9px 14px;font-weight:700}#quiz{display:none;position:fixed;z-index:10;inset:3% 5%;background:linear-gradient(145deg,#1b2b54,#111d3c);border:2px solid #f7d877;border-radius:18px;box-shadow:0 12px 70px #000b;padding:clamp(10px,2.4vh,22px);overflow:auto;touch-action:pan-y;text-align:left}#qt{font-size:clamp(17px,3.8vh,27px);margin:0 0 5px;color:#ffe49a}#question{font-size:clamp(15px,3vh,23px);margin:8px 0 12px;line-height:1.5}#answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}#answers button{min-height:clamp(42px,10vh,75px);font-size:clamp(13px,2.8vh,20px);padding:8px 12px;text-align:left;background:#324779;border:1px solid #91a9df;border-radius:12px;color:white;touch-action:manipulation}#answers button:active{background:#516ca4}#answers button:disabled{opacity:.7}#feedback{margin:8px 0;font-size:clamp(12px,2.4vh,18px);color:#ffe9ad}#rotate{display:none;position:fixed;inset:0;z-index:20;background:#142247;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:22px}@media (orientation:portrait) and (max-width:800px){#rotate{display:flex}}@media(max-height:370px){#quiz{inset:2% 3%;padding:8px}#answers{gap:5px}#question{margin:4px 0}#answers button{min-height:38px}}
</style><div id="stage"><canvas id="game" width="960" height="480"></canvas></div><div id="hud">Helga · Diamanten: 0 · Feuer: nein</div><div id="controls"><div id="dpad"><button class="ctrl" data-key="ArrowLeft" aria-label="Links">◀</button><button class="ctrl" data-key="ArrowRight" aria-label="Rechts">▶</button></div><div id="actions"><button class="ctrl" id="fire" data-key="KeyF" aria-label="Feuerball">🔥</button><button class="ctrl" id="jump" data-key="Space" aria-label="Springen">⬆</button></div></div><button id="switch">⇄ Schwester</button><div id="quiz"><h2 id="qt"></h2><div id="question"></div><div id="answers"></div><p id="feedback" aria-live="polite"></p></div><div id="rotate">📱 ↻<br>Bitte das Smartphone ins Querformat drehen.</div><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><script>
const c=document.getElementById('game'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const questions=[
{type:'Rechnen',q:'Löse das Anfangswertproblem \\(y′(t)+2y(t)=0,\\quad y(0)=3\\).',a:['\\(3e^{2t}\\)','\\(3e^{-2t}\\)','\\(e^{-2t}+2\\)','\\(3-2t\\)'],ok:1,why:'\\(y(t)=Ce^{-2t}\\); aus \\(y(0)=3\\) folgt \\(C=3\\).'},
{type:'Verständnis',q:'Für \\(y′=f(t,y)\\) sei \\(f\\) stetig und bezüglich \\(y\\) lokal Lipschitz-stetig. Welche Aussage gilt?',a:['Es gibt nie Lösungen.','Das Anfangswertproblem besitzt lokal genau eine Lösung.','Alle Lösungen sind periodisch.','Alle Lösungen sind global beschränkt.'],ok:1,why:'Der Satz von Picard–Lindelöf liefert lokale Existenz und Eindeutigkeit.'},
{type:'Rechnen',q:'Welche Funktion löst \\(y′′-3y′+2y=0\\) **nicht**?',a:['\\(e^t\\)','\\(e^{2t}\\)','\\(e^{3t}\\)','\\(4e^t-2e^{2t}\\)'],ok:2,why:'Die charakteristischen Nullstellen sind \\(1\\) und \\(2\\).'},
{type:'Verständnis',q:'Was gilt für \\(y′=-5y\\)?',a:['Die Nulllösung ist instabil.','Die Nulllösung ist asymptotisch stabil.','Alle Lösungen sind periodisch.','Jede Lösung erreicht Null in endlicher Zeit.'],ok:1,why:'Jede Lösung \\(y(t)=Ce^{-5t}\\) konvergiert gegen Null.'},
{type:'Rechnen',q:'Welche Funktion löst \\(u_t=u_{xx}\\) auf \\((0,\\pi)\\) mit \\(u(t,0)=u(t,\\pi)=0\\)?',a:['\\(e^{-4t}\\sin(2x)\\)','\\(e^{4t}\\sin(2x)\\)','\\(e^{-2t}\\sin(2x)\\)','\\(e^{-4t}\\cos(2x)\\)'],ok:0,why:'\\(\\partial_{xx}\\sin(2x)=-4\\sin(2x)\\).'},
{type:'Verständnis',q:'Welche Aussage gilt für die Wärmeleitungsgleichung mit homogenen Dirichlet-Randbedingungen?',a:['Alle Lösungen sind periodisch.','Die \\(L^2\\)-Energie ist nicht zunehmend.','Jede Lösung ist räumlich konstant.','Es gibt keine stationäre Lösung.'],ok:1,why:'Die Energieidentität lautet \\(\\frac{d}{dt}\\int|u|^2=-2\\int|u_x|^2\\leq0\\).'},
{type:'Rechnen',q:'Bestimme die Eigenwerte von \\(A=\\begin{pmatrix}-1&0\\\\0&2\\end{pmatrix}\\).',a:['\\(-1\\) und \\(2\\)','\\(1\\) und \\(-2\\)','\\(-2\\) und \\(1\\)','\\(0\\) und \\(1\\)'],ok:0,why:'Die Eigenwerte einer Diagonalmatrix sind ihre Diagonaleinträge.'},
{type:'Verständnis',q:'Welche Aussage über \\(u_{tt}=c^2u_{xx}\\) für \\(c>0\\) ist richtig?',a:['Es beschreibt Wärmeleitung.','\\(c\\) ist die Ausbreitungsgeschwindigkeit.','Alle Lösungen zerfallen exponentiell.','Randbedingungen sind immer unnötig.'],ok:1,why:'Die Wellengleichung besitzt endliche Ausbreitungsgeschwindigkeit.'}
];
let keys={},lastShot=0,hero=0,diamonds=0,fire=false,bridge=false,gate=false,boss=false,paused=false,active=null,qi=0,shots=[],enemies=[],gems=[];
const W=2700,ground=390;let p={x:50,y:330,vx:0,vy:0,on:false};
function reset(){hero=0;diamonds=0;fire=false;bridge=false;gate=false;boss=false;paused=false;qi=0;p={x:50,y:330,vx:0,vy:0,on:false};shots=[];enemies=[{x:690,alive:true},{x:1480,alive:true},{x:2120,alive:true}];gems=Array.from({length:23},(_,i)=>({x:160+i*102,y:310-(i%3)*35,taken:false}));hud()}
function hud(){document.getElementById('hud').textContent=`${hero?'Emmy':'Helga'} · Diamanten: ${diamonds} · Feuer: ${fire?'ja':'nein'} · Brücke: ${bridge?'offen':'gesperrt'}`}
function ask(title,done){paused=true;active=done;let q=questions[qi++%questions.length];document.getElementById('quiz').style.display='block';document.getElementById('qt').textContent=title+' · '+q.type;document.getElementById('question').innerHTML=q.q.replaceAll('**','');document.getElementById('feedback').textContent='';let a=document.getElementById('answers');a.innerHTML='';q.a.forEach((v,i)=>{let b=document.createElement('button');b.innerHTML='<strong>'+ 'ABCD'[i]+')</strong> '+v;b.onclick=()=>{if(i===q.ok){document.getElementById('feedback').textContent='✓ Richtig! '+q.why;[...a.children].forEach(x=>x.disabled=true);setTimeout(()=>{document.getElementById('quiz').style.display='none';paused=false;done();hud()},1100)}else{document.getElementById('feedback').textContent='Noch nicht. Hinweis: '+q.why}};a.append(b)});if(window.MathJax?.typesetPromise)MathJax.typesetPromise([document.getElementById('quiz')]).catch(()=>{})}
function platforms(){return [{x:350,y:315,w:150},{x:850,y:300,w:140},{x:1280,y:320,w:150},{x:1760,y:290,w:180},{x:2300,y:315,w:130}]}
function update(){if(paused)return;if(keys.KeyF)shoot();let speed=hero?4.2:5.3;let target=((keys.ArrowRight||keys.KeyD)?speed:0)-((keys.ArrowLeft||keys.KeyA)?speed:0);p.vx+=(target-p.vx)*(target?0.23:0.17);if((keys.Space||keys.ArrowUp||keys.KeyW)&&p.on){p.vy=hero?-13:-12;p.on=false}let oldBottom=p.y+38;p.vy+=.58;p.x=Math.max(0,Math.min(W-35,p.x+p.vx));p.y+=p.vy;p.on=false;let onGap=p.x>1040&&p.x<1220&&!bridge;if(p.y+38>=ground&&!onGap&&oldBottom<=ground+15&&p.vy>=0){p.y=ground-38;p.vy=0;p.on=true}for(let b of platforms())if(p.x+27>b.x&&p.x<b.x+b.w&&oldBottom<=b.y+8&&p.y+38>=b.y&&p.vy>=0){p.y=b.y-38;p.vy=0;p.on=true}if(p.y>550){p.x=Math.max(40,p.x-160);p.y=250;p.vy=0}for(let d of gems)if(!d.taken&&Math.abs(p.x-d.x)<28&&Math.abs(p.y-d.y)<40){d.taken=true;diamonds++;hud()}for(let e of enemies)if(e.alive&&Math.abs(p.x-e.x)<27&&Math.abs(p.y+20-(ground-20))<35){p.x=Math.max(0,p.x-90);p.vy=-8}for(let s of shots){s.x+=11;for(let e of enemies)if(e.alive&&Math.abs(s.x-e.x)<25)e.alive=false}shots=shots.filter(s=>s.x<p.x+750);if(!fire&&p.x>550)ask('🔥 Feuertransformation',()=>fire=true);else if(!bridge&&p.x>965)ask('🌉 Brücke reparieren',()=>bridge=true);else if(!boss&&p.x>2470)ask('👹 Endgegner – Runde 1',()=>ask('👹 Endgegner – Finale',()=>{boss=true;alert('🏆 Level geschafft! Helga und Emmy haben die Differentialgleichungen besiegt!')}))}
function draw(){let cam=Math.max(0,Math.min(W-960,p.x-220));g.clearRect(0,0,960,480);let sky=g.createLinearGradient(0,0,0,480);sky.addColorStop(0,'#6e8ce7');sky.addColorStop(1,'#b9f5ed');g.fillStyle=sky;g.fillRect(0,0,960,480);for(let i=0;i<26;i++){let x=i*130-cam*.3;g.fillStyle='#8dc7ba';g.beginPath();g.arc(x,365,90,Math.PI,0);g.fill()}for(let i=0;i<30;i++){let x=i*105-cam*.65;g.fillStyle='#466e65';g.fillRect(x,220+(i%3)*25,18,180);g.fillStyle='#2d8667';g.beginPath();g.arc(x+9,220+(i%3)*25,40,0,Math.PI*2);g.fill()}g.fillStyle='#624d77';g.fillRect(-cam,ground,W,90);g.fillStyle='#55bc79';g.fillRect(-cam,ground,W,12);if(!bridge){g.clearRect(1040-cam,ground,180,90);g.fillStyle='#203452';g.fillRect(1040-cam,ground,180,90)}else{g.fillStyle='#e4a94b';g.fillRect(1040-cam,ground-6,180,15)}for(let b of platforms()){g.fillStyle='#665c90';g.fillRect(b.x-cam,b.y,b.w,20);g.fillStyle='#75d48e';g.fillRect(b.x-cam,b.y,b.w,7)}for(let d of gems)if(!d.taken){g.fillStyle='#f7e26e';g.beginPath();g.moveTo(d.x-cam,d.y-13);g.lineTo(d.x+10-cam,d.y);g.lineTo(d.x-cam,d.y+13);g.lineTo(d.x-10-cam,d.y);g.fill()}for(let e of enemies)if(e.alive){g.fillStyle='#b3549a';g.fillRect(e.x-cam,ground-32,30,32);g.fillStyle='white';g.fillRect(e.x+7-cam,ground-24,5,5);g.fillRect(e.x+20-cam,ground-24,5,5)}for(let [x,symbol] of [[550,'🔥'],[985,'?'],[2490,'👹']]){g.font='35px system-ui';g.fillText(symbol,x-cam,ground-52)}g.fillStyle='#20334b44';g.beginPath();g.ellipse(p.x+14-cam,ground+3,19,5,0,0,Math.PI*2);g.fill();g.fillStyle=hero?'#f2b95b':'#d655a4';g.fillRect(p.x-cam,p.y+12,28,26);g.fillStyle=hero?'#673b31':'#e7c14f';g.fillRect(p.x-cam-2,p.y,32,19);g.fillStyle='white';g.fillRect(p.x+18-cam,p.y+16,5,5);g.fillStyle='#30304b';g.fillRect(p.x+20-cam,p.y+17,2,3);for(let s of shots){g.fillStyle='#ff9c27';g.beginPath();g.arc(s.x-cam,s.y,8,0,7);g.fill()}g.font='18px system-ui';g.fillStyle='#152d43';g.fillText('Wald der Anfangswerte',20,65);requestAnimationFrame(frame)}
function frame(){update();draw()}document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyE'){hero=1-hero;hud()}if(e.code==='KeyF')shoot();if(e.code==='KeyR')reset()});document.addEventListener('keyup',e=>keys[e.code]=false);function shoot(){if(fire&&!paused&&performance.now()-lastShot>280){shots.push({x:p.x+28,y:p.y+23});lastShot=performance.now()}}document.getElementById('switch').onclick=()=>{hero=1-hero;hud()};document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.classList.add('pressed');if(k==='KeyF')shoot()});for(let ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>{keys[k]=false;b.classList.remove('pressed')})});reset();frame();
</script></html>
